# Yerel `netlify deploy --build` / `netlify build` MUTLAKA frontend/ içinden
# çalıştırılmalı — repo kökünden çalıştırılırsa CLI publish yolunu base ile
# birleştirmeden çözüyor (bkz. README.md "Netlify deploy"). Git entegrasyonu
# (Netlify build sunucuları) bu hatadan etkilenmiyor.
[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
